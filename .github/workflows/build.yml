name: Build DYLuckyBag (rootless + roothide)

# Only build the dev branch. Pushing artifacts to ci-artifacts-* does NOT
# retrigger this workflow (those refs are not in the trigger list), avoiding a
# publish -> build loop.
permissions:
  contents: write   # needed to force-push logs/.deb to ci-artifacts-<scheme>

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    # Build both package schemes in parallel, each producing a release + debug deb.
    strategy:
      fail-fast: false
      matrix:
        scheme: [rootless, roothide]
    env:
      THEOS: "${{ github.workspace }}/theos"
      SCHEME: "${{ matrix.scheme }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Capture this step's output too — if brew fails, build.log is never
      # produced and we would otherwise be blind to the real error.
      - name: Install tooling
        run: brew install dpkg ldid 2>&1 | tee install.log

      # Clone + build in ONE step so build.log always captures the failure,
      # even if the theos clone itself fails.
      - name: Clone Theos + SDK and build
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          exec > >(tee build.log) 2>&1
          set -x
          echo "== cloning theos =="
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          rm -rf "$THEOS/sdks"
          git clone --filter=blob:none --sparse --depth 1 https://github.com/theos/sdks.git "$THEOS/sdks"
          git -C "$THEOS/sdks" sparse-checkout set iPhoneOS16.5.sdk
          echo "== building scheme: $SCHEME =="
          echo "== building RELEASE (DYLog compiled out) =="
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=$SCHEME
          mkdir -p out-rel && cp packages/*.deb "out-rel/DYLuckyBag-$SCHEME.deb"
          echo "== building DEBUG (DYLog + file sink, for field diagnosis) =="
          make clean
          rm -rf packages
          make package DEBUG=1 THEOS_PACKAGE_SCHEME=$SCHEME
          mkdir -p out-dbg && cp packages/*.deb "out-dbg/DYLuckyBag-$SCHEME-debug.deb"

      # Surface the failure inline so the human can copy it straight from the
      # run log instead of hunting for a downloadable artifact. Runs even when
      # the build step (continue-on-error) or the publish step failed.
      - name: Surface build errors
        if: always()
        run: |
          echo "## Build diagnostics (scheme: $SCHEME)" >> "$GITHUB_STEP_SUMMARY"
          echo "### install.log (last 30)" >> "$GITHUB_STEP_SUMMARY"
          tail -n 30 install.log 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || echo "(no install.log)"
          echo "### build.log error / fatal lines" >> "$GITHUB_STEP_SUMMARY"
          grep -niE "error:|fatal error|undefined symbols|undefined symbol|ld: |clang: error|make\[|No such file or directory|'UIKit|'Vision" build.log 2>/dev/null | head -80 >> "$GITHUB_STEP_SUMMARY" || true
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### build.log tail (last 60)" >> "$GITHUB_STEP_SUMMARY"
          tail -n 60 build.log 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || echo "(no build.log — the build died before make ran, see install.log above)"

      # Always publish, even on total failure, so the human (who only has SSH,
      # no API token) can fetch the logs from the ci-artifacts-<scheme> branch.
      # Uses a dash (not a slash) in the branch name to avoid any per-ref
      # protection / refspec quirks, and force-pushes an independent branch per
      # scheme so the parallel matrix jobs never clobber each other.
      - name: Publish artifacts to ci-artifacts-<scheme> branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.email "ci@local"
          git config user.name "CI"
          mkdir -p artifacts
          [ -f install.log ] && cp install.log "artifacts/install-$SCHEME.log"
          [ -f build.log ]    && cp build.log    "artifacts/build-$SCHEME.log"
          [ -f "out-rel/DYLuckyBag-$SCHEME.deb" ]        && cp "out-rel/DYLuckyBag-$SCHEME.deb"        "artifacts/DYLuckyBag-$SCHEME.deb"
          [ -f "out-dbg/DYLuckyBag-$SCHEME-debug.deb" ]  && cp "out-dbg/DYLuckyBag-$SCHEME-debug.deb"  "artifacts/DYLuckyBag-$SCHEME-debug.deb"
          {
            echo "scheme=$SCHEME sha=${{ github.sha }}"
            echo "install.log: $([ -f install.log ] && echo present || echo MISSING)"
            echo "build.log:   $([ -f build.log ]    && echo present || echo MISSING)"
            echo "release deb: $([ -f out-rel/DYLuckyBag-$SCHEME.deb ] && echo present || echo MISSING)"
            echo "debug deb:   $([ -f out-dbg/DYLuckyBag-$SCHEME-debug.deb ] && echo present || echo MISSING)"
          } > artifacts/SUMMARY-$SCHEME.txt
          git add -A -f artifacts
          git commit -m "ci artifacts (${{ github.sha }} / $SCHEME)" || echo "nothing to commit"
          if git push --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "HEAD:ci-artifacts-$SCHEME"; then
            echo "PUSH_OK ci-artifacts-$SCHEME"
          else
            echo "PUSH_FAILED ci-artifacts-$SCHEME — see the error above (check Settings > Actions > Workflow permissions = Read and write, and branch protection)."
          fi

      # Independent of repository write permissions, so this is the reliable
      # delivery channel for the human via the run's page (needs no token).
      - name: Upload .deb packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dyluckybag-debs-${{ matrix.scheme }}
          path: |
            out-rel/DYLuckyBag-${{ matrix.scheme }}.deb
            out-dbg/DYLuckyBag-${{ matrix.scheme }}-debug.deb
          if-no-files-found: warn

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.scheme }}
          path: |
            install.log
            build.log
          if-no-files-found: warn

      # The build step uses continue-on-error so it always emits a log; this
      # step makes the run's conclusion reflect whether a .deb actually came out.
      - name: Verify .deb produced
        if: always()
        run: |
          ok=1
          if [ -f "out-rel/DYLuckyBag-$SCHEME.deb" ]; then
            echo "BUILD OK (release/$SCHEME): $(ls -l out-rel/DYLuckyBag-$SCHEME.deb)"
          else
            echo "BUILD FAILED: no release $SCHEME .deb"
            ok=0
          fi
          if [ -f "out-dbg/DYLuckyBag-$SCHEME-debug.deb" ]; then
            echo "BUILD OK (debug/$SCHEME): $(ls -l out-dbg/DYLuckyBag-$SCHEME-debug.deb)"
          else
            echo "BUILD FAILED: no debug $SCHEME .deb"
            ok=0
          fi
          [ "$ok" = "1" ] || exit 1
