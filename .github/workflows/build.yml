name: Build DYLuckyBag (rootless + roothide)

# Only build the dev branch. Pushing artifacts to ci-artifacts does NOT retrigger
# this workflow (ci-artifacts is excluded), avoiding a publish -> build loop.
permissions:
  contents: write   # needed to force-push the .deb / build.log to ci-artifacts

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    # Build both package schemes in parallel, each producing a release + debug deb.
    strategy:
      fail-fast: false
      matrix:
        scheme: [rootless, roothide]
    env:
      THEOS: "${{ github.workspace }}/theos"
      SCHEME: "${{ matrix.scheme }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tooling
        run: brew install dpkg ldid

      # Clone + build in ONE step so build.log always captures the failure,
      # even if the theos clone itself fails.
      - name: Clone Theos + SDK and build
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          exec > >(tee build.log) 2>&1
          set -x
          echo "== cloning theos =="
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          rm -rf "$THEOS/sdks"
          git clone --filter=blob:none --sparse --depth 1 https://github.com/theos/sdks.git "$THEOS/sdks"
          git -C "$THEOS/sdks" sparse-checkout set iPhoneOS16.5.sdk
          echo "== building scheme: $SCHEME =="
          echo "== building RELEASE (DYLog compiled out) =="
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=$SCHEME
          mkdir -p out-rel && cp packages/*.deb "out-rel/DYLuckyBag-$SCHEME.deb"
          echo "== building DEBUG (DYLog + file sink, for field diagnosis) =="
          make clean
          rm -rf packages
          make package DEBUG=1 THEOS_PACKAGE_SCHEME=$SCHEME
          mkdir -p out-dbg && cp packages/*.deb "out-dbg/DYLuckyBag-$SCHEME-debug.deb"

      # Surface the failure inline so the human can copy it straight from the
      # run log instead of hunting for a downloadable artifact. Runs even when
      # the build step (continue-on-error) or the publish step failed.
      - name: Surface build errors
        if: always()
        run: |
          echo "## Build diagnostics (scheme: $SCHEME)" >> "$GITHUB_STEP_SUMMARY"
          if [ ! -f build.log ]; then
            echo "build.log was NOT produced — the build step likely died before make ran (theos/SDK clone, OOM, or runner kill)." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "### error / fatal lines" >> "$GITHUB_STEP_SUMMARY"
          grep -niE "error:|fatal error|undefined symbols|undefined symbol|ld: |clang: error|make\[|No such file or directory|'UIKit|'Vision" build.log | head -80 >> "$GITHUB_STEP_SUMMARY" || true
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### last 70 lines of build.log" >> "$GITHUB_STEP_SUMMARY"
          tail -n 70 build.log >> "$GITHUB_STEP_SUMMARY"
          # Also echo to the live log for quick copy-paste.
          echo "================ BUILD ERROR SUMMARY (scheme: $SCHEME) ================"
          grep -niE "error:|fatal error|undefined symbols|undefined symbol|ld: |clang: error|make\[|No such file or directory" build.log | head -80 || true
          echo "------------------ build.log tail ------------------"
          tail -n 70 build.log

      - name: Publish artifacts to ci-artifacts branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.email "ci@local"
          git config user.name "CI"
          mkdir -p artifacts
          if [ -f build.log ]; then cp build.log "artifacts/ci-last-build-$SCHEME.log"; fi
          if [ -f "out-rel/DYLuckyBag-$SCHEME.deb" ]; then cp "out-rel/DYLuckyBag-$SCHEME.deb" "artifacts/DYLuckyBag-$SCHEME.deb"; fi
          if [ -f "out-dbg/DYLuckyBag-$SCHEME-debug.deb" ]; then cp "out-dbg/DYLuckyBag-$SCHEME-debug.deb" "artifacts/DYLuckyBag-$SCHEME-debug.deb"; fi
          if ls artifacts/* >/dev/null 2>&1; then
            # .gitignore contains "*.deb", so the .deb must be force-added or it
            # is silently skipped and never reaches ci-artifacts (learned the
            # hard way on the NextUp3 build).
            git add -A -f artifacts
            git commit -m "ci artifacts (${{ github.sha }} / $SCHEME)" || echo "nothing to commit"
            # Not fatal: report the failure rather than aborting the job.
            # Push to a per-scheme branch so the parallel matrix jobs do not
            # clobber each other's artifacts (each job force-pushes HEAD:<ref>).
            if ! git push --force https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git "HEAD:ci-artifacts/$SCHEME"; then
              echo "WARNING: could not push ci-artifacts/$SCHEME — run 'git push' error above. (Settings > Actions > Workflow permissions must be Read and write; also check branch protection.)"
            fi
          else
            echo "no artifacts produced; nothing to publish"
          fi

      # Independent of repository write permissions, so this is the reliable
      # delivery channel: downloadable straight from the run's page.
      - name: Upload .deb packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dyluckybag-debs-${{ matrix.scheme }}
          path: |
            out-rel/DYLuckyBag-${{ matrix.scheme }}.deb
            out-dbg/DYLuckyBag-${{ matrix.scheme }}-debug.deb
          if-no-files-found: warn

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.scheme }}
          path: build.log
          if-no-files-found: warn

      # The build step uses continue-on-error so it always emits a log; this
      # step makes the run's conclusion reflect whether a .deb actually came out.
      - name: Verify .deb produced
        if: always()
        run: |
          ok=1
          if [ -f "out-rel/DYLuckyBag-$SCHEME.deb" ]; then
            echo "BUILD OK (release/$SCHEME): $(ls -l out-rel/DYLuckyBag-$SCHEME.deb)"
          else
            echo "BUILD FAILED: no release $SCHEME .deb"
            ok=0
          fi
          if [ -f "out-dbg/DYLuckyBag-$SCHEME-debug.deb" ]; then
            echo "BUILD OK (debug/$SCHEME): $(ls -l out-dbg/DYLuckyBag-$SCHEME-debug.deb)"
          else
            echo "BUILD FAILED: no debug $SCHEME .deb"
            ok=0
          fi
          [ "$ok" = "1" ] || exit 1
